# ============================================
# Eden Nutrition 应用配置
# ============================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 实际启动模块需要显式导入仓库根目录 .env，否则支付宝沙箱密钥不会进入运行时配置。
  config:
    import: optional:file:.env[.properties]

  application:
    name: eden-nutrition
  profiles:
    active: dev

  # 修复 Springfox Swagger 与 Spring Boot 2.6+ 兼容性问题
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/eden_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: eden
    password: edenpass
    # HikariCP 连接池
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: EdenHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    virtual-host: /
    # 消息确认
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 文件上传
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: eden.pojo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 日志配置
logging:
  level:
    eden: DEBUG
    org.mybatis: DEBUG

# Swagger 配置
swagger:
  enabled: true

# Elasticsearch 配置
elasticsearch:
  host: localhost
  port: 9200

# 自定义配置
eden:
  # 支付宝沙箱配置：密钥类参数通过仓库根目录 .env 注入，避免把真实私钥写入仓库。
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    seller-id: ${ALIPAY_SELLER_ID:}
    gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:https://3234d5c4.r27.cpolar.top/api/order/pay/alipay/notify}
    return-url: ${ALIPAY_RETURN_URL:https://3234d5c4.r27.cpolar.top/api/order/pay/alipay/return}
    frontend-return-base-url: ${ALIPAY_FRONTEND_RETURN_BASE_URL:http://localhost:10086}
    weapp-debug-bridge-base-url: ${ALIPAY_WEAPP_DEBUG_BRIDGE_BASE_URL:https://3234d5c4.r27.cpolar.top/api}
    charset: UTF-8
    sign-type: RSA2

