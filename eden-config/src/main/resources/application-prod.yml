# ============================================
# 生产环境配置
# ============================================

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eden_db}?useSSL=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: ${DB_USER:eden}
    password: ${DB_PASSWORD:edenpass}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:user}
    password: ${RABBITMQ_PASSWORD:password}

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}

jwt:
  secret: ${JWT_SECRET:EdenNutritionSecretKey2024VeryLongAndSecure}

logging:
  level:
    root: WARN
    eden: INFO
    org.mybatis: WARN
  file:
    name: /var/log/eden/application.log

swagger:
  enabled: false
